name: Data Factory with GROQ

on:
  workflow_dispatch:                      # تشغيل يدوي من واجهة GitHub
  schedule:
    - cron: '0 2 * * *'                   # تشغيل تلقائي يومياً الساعة 2 صباحاً

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360                  # 6 ساعات كحد أقصى (للتشغيل الطويل)
    permissions:
      contents: write                     # صلاحية الكتابة على المستودع (لـ git push)

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # سحب تاريخ المستودع بالكامل لتجنب مشاكل الدفع

      # 2. إعداد بيئة Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. تثبيت المكتبات المطلوبة
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq datasets tqdm
          # في حال وجود ملف requirements.txt يمكن استخدام:
          # pip install -r requirements.txt

      # 4. استعادة الذاكرة المؤقتة (اختياري، لتسريع التشغيل في المرات القادمة)
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            data/enriched_training_data.jsonl
            data/failed_samples.jsonl
          key: datafactory-groq-${{ github.run_id }}
          restore-keys: datafactory-groq-

      # 5. تشغيل السكريبت الرئيسي لتوليد البيانات
      - name: Run data factory
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # اختياري إذا كنت تستخدمه في الكود
          GROQ_MODEL: "openai/gpt-oss-20b"                # نموذج Groq صحيح ومتاح
          MAX_SAMPLES: 10                                 # عدد العينات (يمكن زيادته لاحقاً)
          REQUEST_DELAY: 3                                # تأخير بين الطلبات لتجنب تجاوز الحد
          OUTPUT_DIR: "data"                              # مجلد حفظ المخرجات
        run: python datafactory_groq.py

      # 6. (اختياري) عرض محتوى الملفات الناتجة للمساعدة في التصحيح
      - name: Debug output (show generated files)
        run: |
          echo "=== ملفات JSONL في مجلد data ==="
          ls -la data/*.jsonl 2>/dev/null || echo "لا توجد ملفات .jsonl"
          echo "=== أول 10 أسطر من micro_engine_train_data.jsonl ==="
          head -n 10 data/micro_engine_train_data.jsonl 2>/dev/null || echo "الملف غير موجود"

      # 7. دفع الملفات الجديدة أو المعدلة إلى المستودع (المطلوب منك)
      - name: Commit and push generated data
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          # إضافة كل التغييرات في مجلد data (جميع الملفات بغض النظر عن الامتداد)
          git add data/
          # git add -A   # (يمكنك تفعيل هذا السطر بدلاً من السابق لإضافة كل التغييرات في كل المجلدات)
          git status    # عرض حالة الملفات المضافة
          git commit -m "تحديث بيانات التدريب [skip ci]" || echo "لا توجد تغييرات جديدة"
          git push

      # 8. رفع الملفات كـ Artifact للتحميل اليدوي (احتياطي)
      - name: Upload output files as artifacts
        if: always()                        # يتم الرفع حتى لو فشلت بعض الخطوات السابقة
        uses: actions/upload-artifact@v4
        with:
          name: enriched-data-${{ github.run_id }}
          path: |
            data/*.jsonl
            data/*.json
          if-no-files-found: warn           # يحذر إذا لم يجد ملفات
          retention-days: 20                 # يحتفظ بالملف 7 أيام            data/enriched_training_data.jsonl
            data/failed_samples.jsonl
          key: datafactory-groq-${{ github.run_id }}
          restore-keys: datafactory-groq-

      - name: Run data factory
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # إذا كنت تستخدمه في الكود
          GROQ_MODEL: "openai/gpt-oss-20b"                # نموذج صحيح ومتاح في Groq
          MAX_SAMPLES: 10                                 # عدد صغير للاختبار، يمكنك زيادته
          REQUEST_DELAY: 3                                # تأخير بين الطلبات لتجنب حد المعدل
          OUTPUT_DIR: "data"                              # مجلد المخرجات
        run: python datafactory_groq.py

      # عرض محتوى الملفات الناتجة للمساعدة في التصحيح (اختياري)
      - name: Debug output
        run: |
          echo "=== محتوى data/*.jsonl ==="
          cat data/*.jsonl || echo "لا توجد ملفات jsonl"
          echo "=== محتوى data/*.json ==="
          cat data/*.json || echo "لا توجد ملفات json"

      # دفع الملفات إلى المستودع (الفرع الحالي)
      - name: Commit and push generated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.jsonl data/*.json 2>/dev/null || echo "لا توجد ملفات للإضافة"
          git commit -m "تحديث بيانات التدريب [skip ci]" || echo "لا توجد تغييرات"
          git push

      # رفع الملفات كـ Artifact (لتحميلها يدوياً من صفحة التشغيل)
      - name: Upload output files as artifacts
        if: always()                      # يتم الرفع حتى لو فشلت بعض الخطوات السابقة
        uses: actions/upload-artifact@v4
        with:
          name: enriched-data-${{ github.run_id }}
          path: |
            data/*.jsonl
            data/*.json
          if-no-files-found: warn        # يحذر إذا لم يجد ملفات
          retention-days: 7              # الاحتفاظ بها لمدة 7 أيام
