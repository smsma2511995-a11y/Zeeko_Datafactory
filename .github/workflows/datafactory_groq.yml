name: Data Factory with GROQ

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq datasets tqdm

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            data/enriched_training_data.jsonl
            data/failed_samples.jsonl
          key: datafactory-groq-${{ github.run_id }}
          restore-keys: datafactory-groq-

      - name: Run data factory
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-20b"
          MAX_SAMPLES: 50
          REQUEST_DELAY: 3
          OUTPUT_DIR: "data"
        run: python datafactory_groq.py

      - name: Debug output (optional)
        run: |
          echo "=== Generated files in data/ ==="
          ls -la data/ || echo "data folder not found"
          echo "=== First 3 lines of micro_engine_train_data.jsonl ==="
          head -n 3 data/micro_engine_train_data.jsonl 2>/dev/null || echo "File not found or empty"

      - name: Commit and push generated data
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add data/
          git status
          git commit -m "تحديث بيانات التدريب [skip ci]" || echo "لا توجد تغييرات جديدة"
          git push
      - name: Upload output files as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enriched-data-${{ github.run_id }}
          path: |
            data/*.jsonl
            data/*.json
          if-no-files-found: warn
          retention-days: 7
